name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # каждые 12 часов
  workflow_dispatch:          # можно запустить вручную
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23786748&color_dots=%23edf1e8,%23cedcc2,%2399b38a,%236b8c60,%23315541
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23d8c39e&color_dots=%2318221c,%232a4031,%234e6d46,%237f9c69,%23b6cba5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
